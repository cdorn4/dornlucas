<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Next thing next home">
          <span class="brand-mark">N</span>
          <span>Next thing next</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/blog/' | relative_url }}">Journal <span aria-hidden="true">&nearr;</span></a>
          <a href="{{ '/photos/' | relative_url }}">Photos <span aria-hidden="true">&nearr;</span></a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
      </div>
    </footer>
  </body>
</html>
