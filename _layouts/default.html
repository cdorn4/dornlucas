<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% seo %}
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Next thing next home">
          <span class="brand-mark">N</span>
          <span class="brand-text">Next thing next</span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
          <a href="{{ '/blog/' | relative_url }}" class="nav-link">Blog <span class="nav-arrow" aria-hidden="true">&nearr;</span></a>
          <a href="{{ '/life-events/' | relative_url }}" class="nav-link">Life Events <span class="nav-arrow" aria-hidden="true">&nearr;</span></a>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <div class="footer-col">
          <p class="footer-brand"><strong>Next thing next</strong> &mdash; The Dorn &amp; Lucas family archive.</p>
          <p class="footer-copy">&copy; {{ 'now' | date: '%Y' }} Chris Dorn &amp; Elyse Lucas. All rights reserved.</p>
        </div>
        <div class="footer-links">
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/life-events/' | relative_url }}">Life Events</a>
          <a href="#main-content" class="back-to-top" aria-label="Scroll back to top">Top &uarr;</a>
        </div>
      </div>
    </footer>
    <script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer></script>
  </body>
</html>
