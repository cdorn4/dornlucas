---
layout: default
---
<article class="post shell narrow">
  <header class="post-header">
    <p class="eyebrow">Journal / {{ page.date | date: '%B %-d, %Y' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt %}<p class="lede">{{ page.excerpt }}</p>{% endif %}
    {% if page.tags.size > 0 %}
      <ul class="tag-list" aria-label="Tags">
        {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
      </ul>
    {% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
